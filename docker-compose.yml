services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — MLflow backend store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fltelco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for MLflow artifacts
  #
  # `minio/minio:latest` is no longer pullable from Docker Hub (the repository
  # was retired), so this uses the Bitnami legacy build, which is the same
  # server under a different tag. The `mc` client image is likewise unavailable,
  # so bucket creation moved into the MLflow container's start-up command.
  # ---------------------------------------------------------------------------
  minio:
    image: bitnamilegacy/minio:latest
    container_name: fltelco-minio
    restart: unless-stopped
    # The Bitnami image runs as uid 1001, but a freshly created named volume is
    # owned by root, so MinIO cannot create /data/.minio.sys and exits with
    # "file access denied". Running as root is acceptable here because this is
    # a local dev stack and the volume holds only MLflow artifacts.
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host ports 9000/9001 are commonly taken (Jupyter kernels, other MinIO
      # instances). MLflow reaches MinIO over the compose network as
      # minio:9000, so only the host mapping needs to move.
      - "9100:9000"   # S3 API
      - "9101:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MLflow tracking server
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: fltelco-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    # `mlflow server` creates the schema itself, which is more reliable than
    # running `mlflow db upgrade` by hand: the upgrade path fails on a database
    # whose alembic history was reset. The catch is that MLflow 2.10 hands
    # gunicorn a 127.0.0.1 bind regardless of --host, so the published port is
    # unreachable. `network_mode: host` sidesteps that entirely — the server
    # listens on the host's loopback and localhost:5000 works as expected.
    network_mode: host
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
             mlflow server
             --backend-store-uri postgresql://mlflow:mlflow@localhost:5432/mlflow
             --default-artifact-root s3://artifacts/
             --host 127.0.0.1
             --port 5000"

  # ---------------------------------------------------------------------------
  # Kafka — KRaft mode (no ZooKeeper). Telemetry bus ONLY, never model weights.
  #
  # Bitnami retired the `bitnami/kafka` tags, so this uses the official Apache
  # image. It is the same broker; only the environment variable prefix differs
  # (KAFKA_ instead of KAFKA_CFG_) and the data directory moved to /var/lib.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: fltelco-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      # 9092 is the in-network listener (kafka:9092). The host reaches the
      # broker through the PLAINTEXT_HOST listener on 29092, because a single
      # advertised address cannot serve both the compose network and localhost.
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Spark — batch data pipeline + evaluation aggregation.
  # Spark NEVER trains models and is NEVER inside the FL loop.
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: fltelco-spark-master
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "8080:8080"   # Spark master UI
      - "7077:7077"   # Spark master RPC
    volumes:
      - ./:/opt/bitnami/spark/work:rw

  spark-worker:
    image: bitnami/spark:3.5
    container_name: fltelco-spark-worker
    restart: unless-stopped
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./:/opt/bitnami/spark/work:rw

  # ---------------------------------------------------------------------------
  # Superset — 3 static BI dashboards (convergence, fairness, privacy)
  # Reads the same postgres as MLflow; tables are written by
  # `python -m src.serving.s23_export_results`.
  # ---------------------------------------------------------------------------
  superset:
    image: apache/superset:3.1.0
    container_name: fltelco-superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: fltelco-superset-secret-change-me
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      # Bootstrap admin, created by the entrypoint on first boot
      ADMIN_USERNAME: admin
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: User
      ADMIN_EMAIL: admin@fltelco.local
      ADMIN_PASSWORD: admin
    volumes:
      - ./dashboards/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./dashboards/superset/init_superset.sh:/app/init_superset.sh:ro
      - superset_data:/app/superset_home
    entrypoint: ["/bin/bash", "/app/init_superset.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    profiles: ["full"]

  # ---------------------------------------------------------------------------
  # Grafana — live telemetry dashboard (optional; enable with --profile full)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fltelco-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  grafana_data:
  superset_data:
