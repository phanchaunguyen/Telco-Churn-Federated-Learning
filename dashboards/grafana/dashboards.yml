# Grafana dashboard provisioning.
#
# Tells Grafana to load every JSON dashboard in this directory on start-up, so
# the live telemetry view appears without any clicking.

apiVersion: 1

providers:
  - name: FLTelco
    orgId: 1
    folder: "FL Telco"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
